<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault | Mi Biblioteca Completa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #121212;
            --bg-side: #181818;
            --bg-item: #1e1e1e;
            --bg-item-hover: #252525;
            --accent: #f39c12; /* Naranja cálido */
            --accent-glow: rgba(243, 156, 18, 0.2);
            --text-p: #e0e0e0;
            --text-s: #a0a0a0;
            --steam: #1b2838;
            --epic: #2a2a2a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-p);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar de Filtros */
        aside {
            width: 260px;
            background-color: var(--bg-side);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
            flex-shrink: 0;
        }

        aside h2 {
            font-size: 1.2rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: var(--text-s);
            text-align: left;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: var(--bg-item);
            color: white;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        /* Contenedor Principal */
        main {
            flex-grow: 1;
            padding: 30px 50px;
            overflow-y: auto;
            background: linear-gradient(180deg, #141414 0%, #121212 100%);
        }

        header {
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            margin: 0;
        }

        header p {
            color: var(--text-s);
            margin-top: 5px;
        }

        /* Lista Vertical */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 1000px;
        }

        .game-row {
            background-color: var(--bg-item);
            padding: 15px 25px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 100px;
            align-items: center;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .game-row:hover {
            background-color: var(--bg-item-hover);
            border-left-color: var(--accent);
            transform: translateX(5px);
        }

        .name-col { font-weight: 600; font-size: 1rem; color: #fff; }
        .platform-col { font-size: 0.8rem; color: var(--text-s); }
        .category-col { font-size: 0.8rem; color: var(--accent); opacity: 0.8; }
        .rating-col { font-size: 0.85rem; color: #66c0f4; }
        .price-col { text-align: right; font-weight: 700; color: var(--accent); }

        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 10px;
            background: #333;
        }

        /* Scrollbar Personalizado */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-body); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 900px) {
            .game-row { grid-template-columns: 1fr 1fr; gap: 10px; }
            .rating-col, .category-col { display: none; }
            body { flex-direction: column; }
            aside { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #333; }
            .filter-group { flex-direction: row; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

        function renderGames(data) {
            const container = document.getElementById('game-list-container');
            const counter = document.getElementById('counter');
            container.innerHTML = '';
            
            data.sort((a,b) => a.n.localeCompare(b.n)).forEach(game => {
                const row = document.createElement('div');
                row.className = 'game-row';
                row.innerHTML = `
                    <div class="name-col"><span class="badge">${game.p}</span>${game.n}</div>
                    <div class="category-col">${game.c.join(', ')}</div>
                    <div class="platform-col">Plataforma: ${game.p}</div>
                    <div class="rating-col">★ ${game.r}</div>
                    <div class="price-col">${game.pr}</div>
                `;
                container.appendChild(row);
            });
            counter.innerText = `${data.length} juegos encontrados en tu biblioteca`;
        }

        function filterBy(cat, btn) {
            // UI Update
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Logic
            if(cat === 'all') {
                renderGames(games);
            } else {
                const filtered = games.filter(g => g.c.includes(cat));
                renderGames(filtered);
            }
        }

        // Init
        renderGames(games);
    </script>
