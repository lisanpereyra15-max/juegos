<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca de Steam | Gaming Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212; /* Fondo oscuro base */
            --card-bg: #1e1e1e; /* Color de las tarjetas */
            --accent-warm: #ff8c00; /* Naranja cálido */
            --accent-soft: #e67e22; /* Ámbar */
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --steam-blue: #171a21;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 40px 0;
            background: linear-gradient(135deg, #1e1e1e 0%, #121212 100%);
            border-bottom: 2px solid var(--accent-warm);
            margin-bottom: 30px;
            border-radius: 8px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-warm);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Estilos de Filtros */
        .filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent-soft);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-warm);
            color: white;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
        }

        /* Grid de Juegos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border-left: 4px solid transparent;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-left-color: var(--accent-warm);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: white;
        }

        .game-platform {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--accent-soft);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tag {
            font-size: 0.7rem;
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--text-dim);
        }

        .game-info {
            border-top: 1px solid #333;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .steam-rating {
            font-size: 0.85rem;
            color: #66c0f4; /* Azul Steam */
        }

        .game-price {
            font-weight: bold;
            color: var(--accent-warm);
            font-size: 1.1rem;
        }

        /* Animación para el filtrado */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mi Biblioteca Steam</h1>
        <p style="color: var(--text-dim);">Colección Personal de Juegos</p>
    </header>

    <div class="filters" id="filter-container">
        <button class="filter-btn active" onclick="filterSelection('all')">Todos</button>
        <button class="filter-btn" onclick="filterSelection('Multiplayer')">Multiplayer</button>
        <button class="filter-btn" onclick="filterSelection('Supervivencia')">Supervivencia</button>
        <button class="filter-btn" onclick="filterSelection('FPS')">FPS</button>
        <button class="filter-btn" onclick="filterSelection('Terror')">Terror</button>
        <button class="filter-btn" onclick="filterSelection('Estrategia')">Estrategia</button>
        <button class="filter-btn" onclick="filterSelection('Aventura')">Aventura</button>
    </div>

    <div class="games-grid" id="games-grid">
        </div>

    <script>
        const games = [
            { title: "A Way Out", platform: "Steam", categories: ["Aventura", "Co-op"], rating: "Muy Positivas", price: "$29.99" },
            { title: "ARK: Survival Evolved", platform: "Steam", categories: ["Supervivencia", "Multiplayer"], rating: "Muy Positivas", price: "$14.99" },
            { title: "Black Mesa", platform: "Steam", categories: ["Shooter", "FPS", "Sci-Fi"], rating: "Extremadamente Positivas", price: "$19.99" },
            { title: "Brawlhalla", platform: "Steam", categories: ["Lucha", "Multiplayer"], rating: "Muy Positivas", price: "Free" },
            { title: "Buckshot Roulette", platform: "Steam", categories: ["Terror", "Estrategia", "Indie"], rating: "Extremadamente Positivas", price: "$2.99" },
            { title: "Counter-Strike 2", platform: "Steam", categories: ["FPS", "Multiplayer", "Competitivo"], rating: "Muy Positivas", price: "Free" },
            { title: "Dead Island Definitive Edition", platform: "Steam", categories: ["Zombies", "Acción", "Co-op"], rating: "Muy Positivas", price: "$19.99" },
            { title: "DOOM", platform: "Steam", categories: ["Acción", "FPS"], rating: "Extremadamente Positivas", price: "$19.99" },
            { title: "Gang Beasts", platform: "Steam", categories: ["Multiplayer", "Party"], rating: "Muy Positivas", price: "$19.99" },
            { title: "Geometry Dash", platform: "Steam", categories: ["Plataformas", "Ritmo"], rating: "Extremadamente Positivas", price: "$4.99" },
            { title: "Grand Theft Auto V", platform: "Steam", categories: ["Mundo Abierto", "Acción"], rating: "Muy Positivas", price: "$29.99" },
            { title: "Left 4 Dead 2", platform: "Steam", categories: ["Zombies", "Co-op", "FPS"], rating: "Extremadamente Positivas", price: "$9.99" },
            { title: "Lethal Company", platform: "Steam", categories: ["Terror", "Co-op", "Multiplayer"], rating: "Extremadamente Positivas", price: "$9.99" },
            { title: "Phasmophobia", platform: "Steam", categories: ["Terror", "Co-op", "Investigación"], rating: "Extremadamente Positivas", price: "$13.99" },
            { title: "Project Zomboid", platform: "Steam", categories: ["Supervivencia", "RPG", "Zombies"], rating: "Extremadamente Positivas", price: "$19.99" },
            { title: "Raft", platform: "Steam", categories: ["Supervivencia", "Co-op", "Aventura"], rating: "Muy Positivas", price: "$19.99" },
            { title: "Subnautica", platform: "Steam", categories: ["Supervivencia", "Exploración"], rating: "Extremadamente Positivas", price: "$29.99" },
            { title: "The Forest", platform: "Steam", categories: ["Supervivencia", "Terror", "Co-op"], rating: "Extremadamente Positivas", price: "$19.99" },
            { title: "The Witcher: Enhanced Edition", platform: "Steam", categories: ["RPG", "Fantasía"], rating: "Muy Positivas", price: "$9.99" },
            { title: "Unravel Two", platform: "Steam", categories: ["Plataformas", "Co-op"], rating: "Muy Positivas", price: "$19.99" }
        ];

        function displayGames(filter = 'all') {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';

            const filteredGames = filter === 'all' 
                ? games 
                : games.filter(g => g.categories.includes(filter));

            filteredGames.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <div>
                        <div class="game-platform">🎮 ${game.platform}</div>
                        <div class="game-title">${game.title}</div>
                        <div class="game-tags">
                            ${game.categories.map(cat => `<span class="tag">${cat}</span>`).join('')}
                        </div>
                    </div>
                    <div class="game-info">
                        <span class="steam-rating">★ ${game.rating}</span>
                        <span class="game-price">${game.price}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterSelection(category) {
            displayGames(category);
            
            // Actualizar estado activo de botones
            const btns = document.getElementsByClassName("filter-btn");
            for (let i = 0; i < btns.length; i++) {
                btns[i].classList.remove("active");
                if (btns[i].innerText === category || (category === 'all' && btns[i].innerText === 'Todos')) {
                    btns[i].classList.add("active");
                }
            }
        }

        // Carga inicial
        displayGames();
    </script>
</body>
</html>
